[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
anyfee = "BixfaA4JmPvntZvGZwnqhHdoUQvEzZY6ZBMXCLgF3C9M"

[programs.devnet]
anyfee = "BixfaA4JmPvntZvGZwnqhHdoUQvEzZY6ZBMXCLgF3C9M"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# scripts/build-program.sh && anchor test --skip-build --skip-local-validator --skip-deploy
# (or simply scripts/test-program.sh) runs the LiteSVM suite against target/deploy/anyfee.so.
test = "cargo test -p anyfee-program-tests"
