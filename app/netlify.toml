# Netlify: the website and its same-origin /api as one site (alternative to wrangler.jsonc; the
# live devnet site runs on Cloudflare Workers).
#
# Site settings: base directory `app`, build command and publish dir below. Netlify installs the
# npm workspace from the repository root, so @anyfee/sdk and @anyfee/attester resolve.
# Environment (Netlify UI, never committed): RPC_URL (devnet), ATTESTER_SECRET_KEY.
# Optional: GITHUB_TOKEN, X_BEARER_TOKEN, ATTESTER_SUBMIT=1, FEE_PAYER_SECRET_KEY, ATTESTER_PUBKEY,
# SITE_URL (absolute origin for og:image at build time; Netlify's URL is used otherwise).
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.18.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# If the vault-page function is missing, vault links still boot the app (without per-page meta).
[[redirects]]
  from = "/v/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
